permalink: /:year/:month/:day/:title.html
highlighter: rouge

## 
## Provide a dummy repository to satisfy the plugin if it executes anyway
##
repository: "noop/noop"

##
## Tell Jekyll to use an empty whitelist array so it loads 
## absolutely zero implicit gems
##
plugins: []

##
## Double exclude to catch old-legacy structures
##
exclude_plugins:
  - jekyll-github-metadata
plugins_exclude:
  - jekyll-github-metadata

##
## Exclude certain paths
##
exclude:
  - DATA/
  - www/

defaults:
  -
    scope:
      path: ""
    values:
      entity: Warbling Wren
      site_author: Warbling Wren
      site_description: "Free musician's companion: see every chord on a color-coded piano keyboard and guitar fretboard, explore rock, blues and jazz progressions, and hear them played."
      title: Warbling Wren
      subtitle: The Musician's Companion
      quip: Your songs are bird seed for your flock
      logo_url: https://avatars.githubusercontent.com/u/337726381
      style_css: /www/css/www.css
      site_js: /www/js/dashboard.js
      branding_ico: /www/img/branding/brand.ico
      og_image: /www/img/branding/og-image.png
      g_analytics_id: G-SWHXT0HQYV
      custom_domain: warblingwren.com
      qr_img: /www/img/branding/qr.png
