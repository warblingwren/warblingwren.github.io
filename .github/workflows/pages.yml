##
## Bulid and deploy a Jekyll site to GitHub Pages
##
name: Deploy Jekyll site to Pages

on:
  ##
  ## Runs on pushes targeting the default branch
  ##
  push:
    branches: ["main"]

  ##
  ## Allows you to run this workflow manually from the Actions tab
  ##
  workflow_dispatch:

##
## Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
##
permissions:
  contents: read
  pages: write
  id-token: write

##
## Allow only one concurrent deployment, skipping runs queued between the run 
## in-progress and latest queued.  However, do NOT cancel in-progress runs as 
## we want to allow these production deployments to complete.
##
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ##
  ## build job
  ##
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Forces shallow clone

      - name: Setup Ruby
        ##
        ## verified SHA for v1.207.0 of ruby/setup-ruby
        ##
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ##
          ## ruby-version: Not needed with a .ruby-version file
          ## bundler-cache: runs 'bundle install' and caches installed gems automatically
          ## cache-version: Increment this number if you need to re-download cached gems
          ##
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        ##
        ## Outputs to the './_site' directory by default
        ##
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        ##
        ## Automatically uploads an artifact from the './_site' directory by default
        ##
        uses: actions/upload-pages-artifact@v3

  ##
  ## Deployment job
  ##
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5