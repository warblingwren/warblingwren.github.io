<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ page.site_description }}">
    <meta name="author" content="{{ page.site_author }}">

    <!-- Link previews (Facebook, iMessage, Slack, Discord, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ page.entity }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.site_description }}">
    <meta property="og:url" content="https://{{ page.custom_domain }}/">
    <meta property="og:image" content="https://{{ page.custom_domain }}{{ page.og_image }}">
    <meta property="og:image:alt" content="{{ page.site_description }}">

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.site_description }}">
    <meta name="twitter:image" content="https://{{ page.custom_domain }}/og-image.png">

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "{{ page.entity }}",
        "url": "https://{{ page.custom_domain }}/",
        "description": "{{ page.site_description }}",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <link rel="canonical" href="https://{{ page.custom_domain }}/">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ page.g_analytics_id }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ page.g_analytics_id }}');
    </script>
    <link rel="icon" href="{{ page.branding_ico }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylsheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Indie+Flower&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ page.style_css }}">
    <link rel="stylesheet" href="www/css/piano.css">
    <link rel="stylesheet" href="www/css/piano-chords.css">
    <link rel="stylesheet" href="www/css/circle-o-5ths.css">
    <link rel="stylesheet" href="www/css/guitar.css">
    <link rel="stylesheet" href="www/css/guitar-chords.css">

    <title>{{ page.title }}</title>

</head>
