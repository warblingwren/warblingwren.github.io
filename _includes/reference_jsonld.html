{%- capture site_root -%}https://{{ page.custom_domain }}/{%- endcapture -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": {{ site_root | append: "#website" | jsonify }},
      "name": {{ page.entity | jsonify }},
      "alternateName": {{ page.subtitle | jsonify }},
      "url": {{ site_root | jsonify }},
      "inLanguage": {{ site.lang | default: "en" | jsonify }}
    }
{%- if page.layout == 'reference' %},
    {
      "@type": "WebPage",
      "@id": {{ page.canonical_url | jsonify }},
      "url": {{ page.canonical_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "isPartOf": { "@id": {{ site_root | append: "#website" | jsonify }} },
      "breadcrumb": { "@id": {{ page.canonical_url | append: "#breadcrumb" | jsonify }} }
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ page.canonical_url | append: "#breadcrumb" | jsonify }},
      "itemListElement": [
      {%- for crumb in page.breadcrumbs %}
        { "@type": "ListItem", "position": {{ forloop.index }}, "name": {{ crumb.name | jsonify }}, "item": {{ crumb.item | jsonify }} }{% unless forloop.last %},{% endunless %}
      {%- endfor %}
      ]
    }
{%- elsif page.url == '/' or page.url == '/index.html' %},
    {
      "@type": "WebApplication",
      "@id": {{ site_root | append: "#app" | jsonify }},
      "name": {{ page.entity | jsonify }},
      "url": {{ site_root | jsonify }},
      "image": {{ page.logo_url | jsonify }},
      "applicationCategory": "MusicApplication",
      "operatingSystem": "Any (web browser)",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "isPartOf": { "@id": {{ site_root | append: "#website" | jsonify }} }
    }
{%- endif %}
  ]
}
</script>
